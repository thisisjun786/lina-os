    {
      "type": "markdown",
      "attributes": {
        "value": "Do not include credentials, private conversations, personal machine inventories or unredacted logs. Use the security reporting link for vulnerabilities."
      }
    },
    {
      "type": "textarea",
      "id": "outcome",
      "attributes": {
        "label": "Desired outcome",
        "description": "What should a user be able to do?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Context and constraints",
        "description": "Describe the concrete use and affected installation profile."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
